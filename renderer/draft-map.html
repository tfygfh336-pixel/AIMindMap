<!DOCTYPE html>
<!-- ============================================================
     草稿图窗口（临时导图窗口 · AI 输出的暂存区）· 功能代号 `DM` · 台账 `W11`
     ------------------------------------------------------------
     为什么是**另一个页面 / 另一个窗口**（而不是主图里的一个视图）：
       台账 `W11` 的硬要求是「临时图**不落 projects/**、**关窗即弃**、**合并前主图零变化**」。
       一个独立窗口是这个语义最直白的实现：窗口没了，草稿就没了（数据只在主进程内存里），
       而"主图零变化"不需要任何额外保证 —— 并入之前主进程根本没碰过盘。
       这也是台账点名的做法：「复用 map-closed.html 那种独立小页面做法，渲染同一套 jsMind 只读视图」。
     a–e 决议里与本页相关的四条：
       a 置顶 / 按内容决定显示范围与窗口大小（本页把内容 bbox 报给主进程，由它钳制后 setContentSize）
       b **允许完整编辑**（2026-10-20 兑现 —— 见 `.review/20261020-editor-复用/00-定题.md`）：
         本页的编辑**不是**本页写的：它调 `renderer/editor.js` 的 `MM.Editor.create(host)`，
         与**主窗同一份实现**。本页只给"宿主该给的东西"（树在哪 / 状态栏 / 能力位 / 改动怎么收口），
         并把改后的树经 IPC `draft:update` 交回主进程那份权威副本（**仍然不落盘**）。
         草稿窗**不能**做的那几件事（写盘 / 撤销栈 / 标签 / 展开状态 / 图片附件 / 跨项目链接 /
         MD 导入导出 / 灯箱详情框）**写在能力位上**，理由文案在 `editor.js` 的 `CAP_NOTES` 一处。
       c 导出 md / json
       e 人与 AI 都能生成（本页只负责"看、改、裁决"，入口在主进程的菜单与控制通道）
     渲染库调用一律经 `MM.adapter.*`（renderer/mindmap-adapter.js 是唯一出口）。
     样式**不引用 `style.css`**（那是**主图那张**表，里面全是主图的布局前提）。
     编辑对话框的骨架由 `editor.js` 现造（本页没有静态骨架 ⇒ 它走 create 那一支），
     所以下面那一段 `.mm-ed-*` 是本页给**共用对话框**写的样式（主窗用的是 `style.css` 里的 `.overlay`）。
     ============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: https:; script-src 'self' file:">
<title>草稿图 · AI MindMap</title>
<link rel="stylesheet" href="vendor/jsmind.css">
<!-- token 层：与主窗 `style.css` 引用的是**同一份** `tokens.css`（单一登记处，见那里的文件头）。
     本页仍然不引用 `style.css`（那张表全是主图的布局前提），但色值/字号/间距/圆角不许各写一份。 -->
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: var(--fs-control); color: var(--ink); background: var(--panel);
    overflow: hidden;
  }
  #bar, #editbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 4px 8px; background: var(--surface); border-bottom: 1px solid var(--border);
    white-space: nowrap; overflow: hidden;
  }
  #editbar { background: var(--panel); padding-top: 4px; padding-bottom: 4px; }
  #bar #title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  #bar #src { font-weight: 400; color: var(--ink-2); }
  #bar #stat { color: var(--ink-2); }
  #bar #dropped { color: var(--warn-ink); font-size: var(--fs-meta); }
  #bar #note { color: var(--warn-ink); font-size: var(--fs-meta); }
  #editbar #sel { color: var(--accent); font-size: var(--fs-meta); min-width: 12ch; }
  #bar .spacer, #editbar .spacer { flex: 1 1 auto; }
  #bar button, #editbar button, #pick button, #move button {
    padding: 4px 8px; font-size: var(--fs-meta); cursor: pointer;
    border: 1px solid var(--control); border-radius: var(--r-control); background: var(--surface); color: var(--accent);
    min-height: var(--hit-min);   /* 可点区（app-screens §9.4 控件高 27-40、median 34） */
  }
  #bar button:hover:not(:disabled), #editbar button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-bg); }
  #bar button:disabled, #editbar button:disabled { color: var(--ink-3); cursor: default; }
  #bar button.danger { color: var(--danger-ink); }
  #pick, #move {
    flex: 0 0 auto; display: none; align-items: center; gap: 8px;
    padding: 4px 8px; background: var(--warn-bg); border-bottom: 1px solid var(--warn-border);
  }
  #pick.on, #move.on { display: flex; }
  #pick select, #move select { max-width: 60ch; font-size: var(--fs-meta); padding: 4px 4px; }
  #stage { flex: 1 1 auto; position: relative; overflow: hidden; background: var(--panel); }
  #jsmind_container { position: absolute; inset: 0; overflow: auto; }
  #status {
    flex: 0 0 auto; padding: 4px 8px; background: var(--surface); border-top: 1px solid var(--border);
    color: var(--ink-2); font-size: var(--fs-meta); min-height: 18px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #status.err { color: var(--danger-ink); }
  /* 持久错误条（见 body 里那段注释）：**浮在画布上、不挡操作**，只有 ✕ 可点。
     位置在左下、避开顶部两条按钮条与底部状态栏；210px 高的窗口里它也只占 44px。 */
  #err-toast {
    position: fixed; left: 8px; bottom: 32px; z-index: 90;
    display: flex; align-items: flex-start; gap: 8px;
    max-width: min(520px, calc(100vw - 16px)); max-height: 50vh; overflow: auto;
    padding: 8px 8px 8px 12px; border-radius: var(--r-card);
    background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger-ink);
    font-size: var(--fs-meta); line-height: 1.5; word-break: break-word;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);   /* 它真的浮着 —— house rules 允许浮层有投影 */
    pointer-events: none;
  }
  #err-toast[hidden] { display: none; }   /* 必须排在 #err-toast 之后（同特异度，后写的赢） */
  #err-toast button {
    flex: 0 0 auto; pointer-events: auto; cursor: pointer;
    border: 1px solid var(--danger-border); background: var(--surface); color: var(--danger-ink);
    border-radius: var(--r-chip); font-size: var(--fs-meta); line-height: 1;
    min-width: 28px; min-height: 28px;
  }
  /* 节点不可 inline 编辑（编辑走共用编辑器的对话框）；双击会开那个框 */
  jmnode { cursor: pointer; }

  /* ===== 共用编辑器（renderer/editor.js）在本页里的外观 =====
     为什么这些规则在这里而不在 `style.css`：主窗用的是 `style.css` 的 `.overlay`/`.dialog-box`
     （**一个字节都没改**），草稿页不引用那张表 ⇒ 由本页给它写一份 `mm-ed-*` 的皮。
     ⚠️ 这不是"第二份实现"：**行为、字段、校验、能力拒绝全在 editor.js 一处**，这里只有颜色与间距。 */
  .mm-ed-overlay {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .35);
  }
  .mm-ed-box {
    background: var(--surface); border-radius: var(--r-card); padding: 16px 16px;
    width: min(640px, 92vw); max-height: 88vh;
    /* 【2026-10-27 UI 优化】flex 列 + 内部滚动：动作行是**不动的一行**，正文区自己滚。
     * 为什么不是 sticky（主窗那一种是 sticky）：本页视口实测只有 251px 高，sticky 的动作行会
     * **压在**滚到它底下的内容上 —— 域 56 实测过这个副作用（"正文格中心命中的是 DIV"）。
     * flex 列不覆盖任何东西：动作行占它自己那一行位置，正文区在它上面滚。 */
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .22);
  }
  .mm-ed-box h3 { margin: 0 0 12px; font-size: var(--fs-title); flex: 0 0 auto; }
  /* 正文区：唯一会滚的那一块（min-height:0 是 flex 列里"允许收缩到比内容小"的必要条件） */
  .mm-ed-body { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .mm-ed-row { display: block; margin-bottom: 8px; font-size: var(--fs-meta); color: var(--ink-2); }
  .mm-ed-row input[type="text"], .mm-ed-row textarea {
    display: block; width: 100%; margin-top: 4px; box-sizing: border-box;
    padding: 4px 8px; font-size: var(--fs-control); color: var(--ink);
    border: 1px solid var(--control); border-radius: var(--r-control); font-family: inherit;
  }
  .mm-ed-row textarea { resize: vertical; }
  .mm-ed-chk { display: flex; align-items: center; gap: 4px; }
  /* 【2026-10-27 UI 优化 · 「保存」必须始终在视口内】
   * 由来（实测）：本页窗口是**按内容定大小**的，实测出现过 805×251 的视口；而
   * `.mm-ed-box` 是 `max-height:88vh; overflow:auto` ⇒ 88vh = 221px，比编辑框内容矮
   * ⇒ 动作行（含「保存」）被滚出视口，用户得先自己往下滚才能点到保存。
   * 修法 = `.mm-ed-box` 改 flex 列 + `.mm-ed-body` 自己滚（见上面那条规则），动作行是
   * **不动的 flex 项**（`flex: 0 0 auto`）⇒ 永远在框的可见区内，且不覆盖正文。
   * 这是纯 CSS 的，不改 `editor.js` 现造的任何 id/DOM 契约（只多了一层 `.mm-ed-body` 包裹，
   * 骨架仍只有一套 —— `tests/editor-reuse` 不受影响）。 */
  .mm-ed-actions {
    display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; flex: 0 0 auto;
    padding-top: 8px; padding-bottom: 4px;
    background: var(--surface); border-top: 1px solid var(--rule);
  }
  .mm-ed-actions button {
    min-height: var(--hit-min);
    padding: 4px 12px; font-size: var(--fs-control); cursor: pointer;
    border: 1px solid var(--control); border-radius: var(--r-control); background: var(--surface); color: var(--ink);
  }
  .mm-ed-actions button.mm-ed-primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
</style>
</head>
<body>
  <div id="bar">
    <span id="title">草稿图</span>
    <span id="src"></span>
    <span id="stat"></span>
    <span id="dropped"></span>
    <span class="spacer"></span>
    <button id="btn-merge" title="并入主导图（会问落点）">并入主导图</button>
    <button id="btn-md" title="导出 Markdown">导出 md</button>
    <button id="btn-json" title="导出 JSON">导出 json</button>
    <button id="btn-discard" class="danger" title="丢弃这份草稿并关窗">丢弃</button>
  </div>
  <!-- 编辑那一排：**每个按钮只做"取选中 + 调共用编辑器"**（实现全在 renderer/editor.js） -->
  <div id="editbar">
    <span id="sel">选中：—</span>
    <button id="btn-edit" title="编辑选中节点的标题/正文（也可双击节点）">编辑节点</button>
    <button id="btn-add-child" title="在选中节点下加一个子节点">＋子节点</button>
    <button id="btn-add-sibling" title="在选中节点的同级末尾加一个节点">＋同级</button>
    <button id="btn-del" class="danger" title="删除选中节点（含整棵子树）">删除</button>
    <button id="btn-up" title="与上一个同级节点交换位置">↑</button>
    <button id="btn-down" title="与下一个同级节点交换位置">↓</button>
    <button id="btn-move" title="改挂到另一个节点下（落点由你选）">移到…</button>
    <span class="spacer"></span>
    <span id="note">临时 · 不落盘 · 关窗即弃</span>
  </div>
  <div id="pick">
    <span>并入到：</span>
    <select id="pick-parent"></select>
    <button id="pick-ok">确认并入</button>
    <button id="pick-cancel">取消</button>
  </div>
  <div id="move">
    <span>移到谁的下面：</span>
    <select id="move-parent"></select>
    <button id="move-ok">确认移动</button>
    <button id="move-cancel">取消</button>
  </div>
  <div id="stage"><div id="jsmind_container"></div></div>
  <div id="status"></div>
  <!-- 持久错误条：与主窗 `index.html` 的 `#err-toast` **同一形态、同一纪律**（那里有一段长注释
       说明为什么放在工具栏/状态栏之外）。本页没有原生侧栏 ⇒ 不需要让位变量。
       判据：`scripts/smoke/56-草稿图编辑.js`（报错 200ms 后仍在屏幕上）。 -->
  <div id="err-toast" role="alert" aria-live="assertive" hidden>
    <span id="err-toast-text"></span>
    <button id="err-toast-close" type="button" title="收起这条报错（报错原文仍留在状态栏）">✕</button>
  </div>

  <script src="vendor/jsmind.js"></script>
  <script src="../src/convert.js"></script>
  <script src="../src/draft-map.js"></script>
  <script src="mindmap-adapter.js"></script>
  <!-- ★ 共用编辑器：主窗 `index.html` 也加载**同一份**（本页没有静态对话框骨架 ⇒ 它走 create 那一支） -->
  <script src="editor.js"></script>
  <script src="draft-map.js"></script>
</body>
</html>
